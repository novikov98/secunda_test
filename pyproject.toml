[project]
name = "secunda-test"
version = "0.1.0"
description = ""
authors = [
    {name = "Artur",email = "novikovartur.na@yandex.ru"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "sqlalchemy (>=2.0.52,<3.0.0)",
    "alembic (>=1.19.1,<2.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "uvicorn (>=0.52.1,<0.53.0)",
    "faststream[cli,rabbit] (>=0.7.4,<0.8.0)",
    "httpx (>=0.28.0,<0.29.0)",
    "tenacity (>=9.1.4,<10.0.0)"
]


[tool.poetry]
# Приложение, а не библиотека — в venv ставятся только зависимости.
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)",
    "ruff (>=0.16.2,<0.17.0)",
    "pre-commit (>=4.6.2,<5.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)"
]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez — даты только с таймзоной
    "T20",  # flake8-print — никаких print в коде
    "SIM",  # flake8-simplify
    "RUF",
]
ignore = [
    "E501",     # длину строк держит black
    "RUF001",   # кириллица в строках/комментариях — проект документирован по-русски
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["I", "N", "UP"]

[tool.pytest.ini_options]
# package-mode = false, проект не ставится в venv — добавляем корень в sys.path руками.
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
